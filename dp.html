<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Douze Points for Murder: The Cast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{--night:#1A0F3A;--plum:#5C1450;--bar:#2B1D5E;--gold:#FFCE66;--pink:#FF6FB5;--ink:#F7F1FF;--soft:#D9CCF0}
*{box-sizing:border-box;margin:0;padding:0}
html{background-color:var(--night);background-image:radial-gradient(2px 2px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(2px 2px at 78% 9%,#ffce6699 50%,transparent 51%),radial-gradient(3px 3px at 64% 31%,#ff6fb588 50%,transparent 51%),radial-gradient(2px 2px at 29% 47%,#fff6 50%,transparent 51%),radial-gradient(2px 2px at 88% 58%,#ffce6688 50%,transparent 51%),radial-gradient(3px 3px at 7% 72%,#ff6fb577 50%,transparent 51%),linear-gradient(180deg,var(--night) 0%,#2A1150 45%,var(--plum) 100%);min-height:100%}
body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{text-align:center;padding:72px 0 48px}
.points{display:inline-grid;place-items:center;width:96px;height:96px;border-radius:22px;background:var(--gold);color:var(--night);font-weight:800;font-size:56px;line-height:1;transform:rotate(-6deg);box-shadow:0 0 40px #ffce6666;margin-bottom:28px}
h1{font-weight:800;font-size:clamp(2.6rem,7vw,5rem);line-height:1.02;letter-spacing:-.02em}
.when{color:var(--gold);font-weight:500;font-size:1.15rem;margin-top:18px}
.teaser{max-width:640px;margin:22px auto 0;color:var(--soft);font-size:1.05rem}
.teaser p+p{margin-top:12px}
.dress{display:inline-block;margin-top:26px;padding:10px 20px;border:2px solid var(--pink);border-radius:999px;font-weight:500}
section{padding:44px 0}
h2{font-weight:800;font-size:clamp(1.6rem,3.5vw,2.2rem);margin-bottom:6px}
.lead{color:var(--soft);margin-bottom:26px}
h3{font-weight:700;font-size:1.35rem;line-height:1.2}
.role{color:var(--gold);font-weight:500;margin:2px 0 6px}
.hosts{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:flex-end}
.host{flex:0 1 auto;max-width:100%}
.host img{display:block;height:260px;width:auto;max-width:100%;object-fit:cover;border-radius:20px;border:4px solid var(--gold)}
.host figcaption{max-width:380px;margin-top:14px}
.finalists{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.finalist img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:24px;border:4px solid var(--gold);box-shadow:0 0 36px #ff6fb555;margin-bottom:14px}
.board{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.row{display:flex;gap:16px;align-items:center;background:var(--bar);border-left:6px solid var(--pink);border-radius:6px 16px 16px 6px;padding:12px 16px 12px 12px}
.row:nth-child(even){border-left-color:var(--gold)}
.row img{flex:none;width:88px;height:88px;object-fit:cover;border-radius:12px}
.row h3{font-size:1.15rem}
.row .role{margin:0 0 2px}
.row p:last-child{font-size:.92rem;color:var(--soft);line-height:1.45}
footer{text-align:center;color:var(--soft);font-size:.9rem;padding:40px 0 56px}
@media (max-width:760px){
  header{padding:52px 0 32px}
  .finalists{grid-template-columns:1fr;max-width:420px;margin:0 auto}
  .board{grid-template-columns:1fr}
  .host img{height:200px}
}

.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.gate form{width:100%;max-width:420px;text-align:center}
.gate h1{font-size:clamp(2.2rem,8vw,3.4rem);margin-bottom:10px}
.gate p{color:var(--soft);margin-bottom:22px}
.gate label{display:block;text-align:left;font-weight:500;margin-bottom:8px}
.gate input{width:100%;font:inherit;font-size:1.1rem;padding:14px 16px;border-radius:14px;border:2px solid var(--gold);background:#ffffff14;color:var(--ink)}
.gate input:focus{outline:3px solid var(--pink);outline-offset:2px}
.gate button{margin-top:14px;width:100%;font:inherit;font-weight:700;font-size:1.05rem;padding:14px;border:0;border-radius:14px;background:var(--gold);color:var(--night);cursor:pointer}
.gate button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.gate button[disabled]{opacity:.6;cursor:wait}
.gate .msg{min-height:1.6em;margin:14px 0 0;color:#FFB3D6;font-weight:500}
</style>
</head>
<body>
<main class="gate" id="gate">
  <form id="f" autocomplete="off">
    <div class="points" aria-hidden="true">12</div>
    <h1>Douze Points for Murder</h1>
    <p>The cast list is for party guests only.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <button id="go" type="submit">Open the cast list</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
</main>
<div id="content"></div>

<script>
(function(){
  var D = JSON.parse(document.getElementById('data').textContent);
  var ub = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  var KEY = 'douze-cast-pw';
  async function unlock(pw){
    var norm = pw.replace(/\s+/g,'').toLowerCase();
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:ub(D.s), iterations:D.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:ub(D.i)}, key, ub(D.c));
    return new TextDecoder().decode(plain);
  }
  function show(html){
    document.getElementById('gate').remove();
    document.getElementById('content').innerHTML = html;
    window.scrollTo(0,0);
  }
  var f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'), msg = document.getElementById('msg');
  if (!window.crypto || !crypto.subtle) {
    msg.textContent = 'This browser can\'t open the page. Try opening the link in Safari or Chrome.';
    go.disabled = true; return;
  }
  f.addEventListener('submit', async function(e){
    e.preventDefault();
    go.disabled = true; go.textContent = 'Opening...'; msg.textContent = '';
    try {
      var html = await unlock(pw.value);
      try { localStorage.setItem(KEY, pw.value); } catch(_) {}
      show(html);
    } catch(err) {
      go.disabled = false; go.textContent = 'Open the cast list';
      msg.textContent = "That's not the password. Check the WhatsApp group.";
      pw.select();
    }
  });
  try {
    var saved = localStorage.getItem(KEY);
    if (saved) unlock(saved).then(show).catch(function(){ try { localStorage.removeItem(KEY); } catch(_) {} });
  } catch(_) {}
  pw.focus();
})();
</script>
